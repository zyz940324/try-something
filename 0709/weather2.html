<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>全球天氣查詢</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
        }

        body {
            background: linear-gradient(to right, #74ebd5, #ACB6E5);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .weather-container {
            background: white;
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            max-width: 900px;
            width: 100%;
        }

        h1 {
            text-align: center;
            margin-bottom: 1.5rem;
            font-size: 2rem;
            color: #333;
        }

        .search-box {
            display: flex;
            justify-content: center;
            margin-bottom: 1.5rem;
        }

        .search-box input {
            width: 70%;
            padding: 0.8rem;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 8px 0 0 8px;
        }

        .search-box button {
            padding: 0.8rem 1.2rem;
            font-size: 1rem;
            border: none;
            background-color: #4a90e2;
            color: white;
            border-radius: 0 8px 8px 0;
            cursor: pointer;
            transition: background 0.3s;
        }

        .search-box button:hover {
            background-color: #357ABD;
        }

        .result {
            background: #f9f9f9;
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid #eee;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .label {
            font-weight: bold;
            color: #444;
        }

        #weatherChart {
            max-width: 100%;
            height: 400px;
        }
    </style>
</head>

<body>
    <div class="weather-container">
        <h1>🌍 全球天氣查詢</h1>
        <div class="search-box">
            <input type="text" id="cityInput" placeholder="請輸入城市名稱..." />
            <button onclick="getWeather()">查詢</button>
        </div>
        <div class="result" id="resultBox">請輸入城市並點擊「查詢」來取得天氣資訊。</div>
        <canvas id="weatherChart"></canvas>
    </div>

    <script>
        let chartInstance;

        function formatTime(unix, timezoneOffset) {
            const date = new Date((unix + timezoneOffset) * 1000);
            return date.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });
        }

        async function getWeather() {
            const apiKey = '6c125517593a85f53a5d393c9e14c09e'; // ⬅️ 請替換為你的 OpenWeatherMap API Key
            const city = document.getElementById('cityInput').value.trim();
            const resultBox = document.getElementById('resultBox');

            if (!city) {
                resultBox.textContent = '⚠️ 請輸入有效的城市名稱';
                return;
            }

            resultBox.textContent = '🔄 正在取得天氣資料...';

            try {
                const response = await fetch(`https://api.openweathermap.org/data/2.5/forecast?q=${encodeURIComponent(city)}&appid=${apiKey}&units=metric&lang=zh_tw`);
                if (!response.ok) throw new Error(`查詢失敗：HTTP ${response.status}`);

                const data = await response.json();
                const current = data.list[0];
                const weather = current.weather[0];
                const main = current.main;
                const wind = current.wind;
                const rain = current.rain || {};
                const visibility = current.visibility;
                const clouds = current.clouds;

                resultBox.innerHTML = `
          <div><span class="label">📍 城市：</span>${data.city.name}</div>
          <div><span class="label">🌤️ 天氣狀況：</span>${weather.description}（${weather.main}）</div>
          <div><span class="label">🌡️ 溫度：</span>${main.temp}°C（體感：${main.feels_like}°C）</div>
          <div><span class="label">🌡️ 最低 / 最高溫：</span>${main.temp_min}°C / ${main.temp_max}°C</div>
          <div><span class="label">💧 濕度：</span>${main.humidity}%</div>
          <div><span class="label">🌬️ 風速：</span>${wind.speed} m/s，方向：${wind.deg}°</div>
          <div><span class="label">🌧️ 降雨量：</span>${rain['3h'] ? rain['3h'] + ' mm / 3hr' : '無'}</div>
          <div><span class="label">🌫️ 能見度：</span>${visibility} 公尺</div>
          <div><span class="label">☁️ 雲量：</span>${clouds.all}%</div>
          <div><span class="label">🧭 氣壓：</span>${main.pressure} hPa</div>
        `;

                // 圖表繪製
                const labels = data.list.slice(0, 8).map(entry => {
                    const d = new Date(entry.dt * 1000);
                    return d.getHours() + ':00';
                });
                const temps = data.list.slice(0, 8).map(entry => entry.main.temp);

                const ctx = document.getElementById('weatherChart').getContext('2d');
                if (chartInstance) chartInstance.destroy();
                chartInstance = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: '未來24小時溫度 (°C)',
                            data: temps,
                            fill: false,
                            borderColor: '#4a90e2',
                            tension: 0.3
                        }]
                    },
                    options: {
                        scales: {
                            y: {
                                beginAtZero: false
                            }
                        }
                    }
                });

            } catch (error) {
                resultBox.textContent = `❌ 錯誤：${error.message}`;
            }
        }
    </script>
</body>

</html>
