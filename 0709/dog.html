<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>隨機狗狗圖片 - Dog CEO API</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background: #f0f4f8;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            color: #333;
            padding: 2rem 1rem;
        }

        h1 {
            margin-bottom: 0.5rem;
            color: #2c3e50;
            text-align: center;
            font-weight: 700;
            text-shadow: 1px 1px 4px #a3b1c6;
        }

        #dog-image {
            margin-top: 2rem;
            max-width: 90vw;
            max-height: 70vh;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(44, 62, 80, 0.2);
            transition: opacity 0.5s ease-in-out;
            opacity: 0;
        }

        #dog-image.visible {
            opacity: 1;
        }

        button {
            background: #3498db;
            border: none;
            padding: 1rem 2rem;
            margin-top: 1.5rem;
            font-size: 1.25rem;
            font-weight: 600;
            color: white;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.4);
            transition: background 0.3s ease, box-shadow 0.3s ease;
            user-select: none;
        }

        button:hover {
            background: #2980b9;
            box-shadow: 0 8px 25px rgba(41, 128, 185, 0.6);
        }

        button:active {
            transform: scale(0.95);
        }

        #loading-text {
            margin-top: 1rem;
            font-style: italic;
            color: #666;
            min-height: 1.2em;
        }

        footer {
            margin-top: auto;
            font-size: 0.9rem;
            color: #999;
            padding: 1rem;
            text-align: center;
        }

        @media (max-width: 480px) {
            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <h1>隨機狗狗圖片</h1>
    <button id="fetch-btn">取得可愛狗狗 🐶</button>
    <div id="loading-text"></div>
    <img id="dog-image" src="" alt="隨機狗狗圖片" />
    <footer>圖片來源：<a href="https://dog.ceo/dog-api/" target="_blank" rel="noopener noreferrer">Dog CEO's Dog API</a>
    </footer>

    <script>
        const btn = document.getElementById('fetch-btn');
        const img = document.getElementById('dog-image');
        const loadingText = document.getElementById('loading-text');

        async function fetchDogImage() {
            try {
                loadingText.textContent = '載入中...';
                img.classList.remove('visible');
                const res = await fetch('https://dog.ceo/api/breeds/image/random');
                if (!res.ok) throw new Error('網路錯誤');
                const data = await res.json();
                if (data.status !== 'success') throw new Error('API 回傳錯誤');
                img.src = data.message;
                img.alt = '隨機狗狗圖片';
                img.onload = () => {
                    loadingText.textContent = '';
                    img.classList.add('visible');
                };
            } catch (err) {
                loadingText.textContent = '取得圖片失敗，請稍後再試';
                console.error(err);
            }
        }

        btn.addEventListener('click', fetchDogImage);

        // 頁面載入時先取得一張圖片
        window.onload = fetchDogImage;
    </script>
</body>

</html>
