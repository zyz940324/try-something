<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🌍 人口密度查詢系統</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eef2f3;
            text-align: center;
            padding: 2rem;
        }

        h1 {
            color: #2c3e50;
        }

        input {
            padding: 0.6rem;
            font-size: 1rem;
            width: 250px;
            margin-right: 0.5rem;
        }

        button {
            padding: 0.6rem 1rem;
            font-size: 1rem;
            background-color: #3498db;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        #result {
            margin-top: 2rem;
            background: white;
            padding: 1rem;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>

<body>

    <h1>🌍 人口密度查詢系統</h1>
    <input type="text" id="countryInput" placeholder="請輸入國家名稱（例如：Taiwan）" />
    <button onclick="fetchDensity()">查詢</button>

    <div id="result"></div>

    <script>
        async function fetchDensity() {
            const country = document.getElementById('countryInput').value.trim();
            const resultDiv = document.getElementById('result');

            if (!country) {
                resultDiv.innerHTML = '<p>請輸入國家名稱！</p>';
                return;
            }

            resultDiv.innerHTML = '查詢中...';

            try {
                const response = await fetch(`https://restcountries.com/v3.1/name/${encodeURIComponent(country)}`);
                const data = await response.json();

                if (data.status === 404 || !data[0]) {
                    resultDiv.innerHTML = `<p>找不到「${country}」的資料。</p>`;
                    return;
                }

                const countryData = data[0];
                const name = countryData.name.common;
                const population = countryData.population;
                const area = countryData.area;
                const density = (population / area).toFixed(2);

                resultDiv.innerHTML = `
          <h3>${name}</h3>
          <p>🌎 面積：${area.toLocaleString()} km²</p>
          <p>👥 人口：${population.toLocaleString()} 人</p>
          <p>📊 人口密度：約 <strong>${density}</strong> 人 / km²</p>
        `;
            } catch (err) {
                console.error(err);
                resultDiv.innerHTML = '<p>查詢發生錯誤，請稍後再試。</p>';
            }
        }
    </script>

</body>

</html>
