<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>整合查詢工具</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&family=Roboto:wght@400;700&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Noto Sans TC', 'Roboto', sans-serif;
            margin: 0;
            background: #f7f9fc;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }

        .main-container {
            background: white;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            border-radius: 16px;
            max-width: 900px;
            width: 100%;
            padding: 20px;
            margin-top: 40px;
        }

        .tabs {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #eee;
        }

        .tab-button {
            background-color: #f0f0f0;
            border: none;
            padding: 12px 20px;
            cursor: pointer;
            font-size: 1rem;
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
            transition: background-color 0.3s, color 0.3s;
            flex-grow: 1;
            text-align: center;
            white-space: nowrap;
        }

        .tab-button:hover {
            background-color: #e0e0e0;
        }

        .tab-button.active {
            background-color: #0e7490;
            color: white;
            border-bottom: 2px solid #0e7490;
        }

        .tab-content {
            display: none;
            padding: 20px 0;
        }

        .tab-content.active {
            display: block;
        }

        /* Styles from 地圖.html */
        .city-info-container h1 {
            text-align: center;
            color: #0e7490;
        }

        .city-info-container input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            font-size: 16px;
            border: 2px solid #d1d5db;
            border-radius: 8px;
            box-sizing: border-box;
            margin-top: 10px;
            margin-bottom: 20px;
        }

        .city-info-container button {
            width: 100%;
            padding: 12px;
            background-color: #0e7490;
            color: white;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .city-info-container button:hover {
            background-color: #155e75;
        }

        .city-info-result {
            margin-top: 30px;
        }

        .city-info-loading {
            text-align: center;
            color: #666;
        }

        .city-info-error {
            color: red;
            text-align: center;
            margin-top: 10px;
        }

        .info-card {
            background: #f0fdf4;
            padding: 16px;
            border-radius: 12px;
            margin-top: 10px;
            line-height: 1.6;
        }

        /* Styles from 空品.html */
        .aqi-container h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #00796b;
        }

        .aqi-container input,
        .aqi-container button {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            margin-bottom: 16px;
            border-radius: 8px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        .aqi-container button {
            background-color: #00796b;
            color: white;
            border: none;
            cursor: pointer;
        }

        .aqi-container button:hover {
            background-color: #004d40;
        }

        .aqi-result {
            background: #f0f0f0;
            padding: 16px;
            border-radius: 8px;
            max-height: 400px;
            overflow-y: auto;
            white-space: normal;
            word-break: break-word;
        }

        .aqi-result ul {
            padding-left: 20px;
        }

        .aqi-result li {
            margin: 4px 0;
        }

        /* Styles from 外匯.html */
        .currency-container {
            background: rgba(255, 255, 255, 0.1);
            padding: 30px 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            max-width: 420px;
            width: 100%;
            backdrop-filter: blur(10px);
            margin: auto;
            /* Center in tab */
            background: #fff;
            /* Override background for tabbed view */
            color: #333;
        }

        .currency-container h1 {
            text-align: center;
            margin-bottom: 30px;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: #8a2be2;
            /* Specific color for this h1 */
        }

        .currency-container label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 1rem;
            color: #333;
            /* Darker color for visibility */
        }

        .currency-container select,
        .currency-container input[type="number"] {
            width: 100%;
            padding: 10px 15px;
            margin-bottom: 20px;
            border-radius: 8px;
            border: none;
            font-size: 1rem;
            font-weight: 600;
            color: #333;
            background: #f0f0f0;
            transition: box-shadow 0.3s ease;
        }

        .currency-container select:focus,
        .currency-container input[type="number"]:focus {
            outline: none;
            box-shadow: 0 0 8px #8a2be2;
        }

        .currency-container button {
            width: 100%;
            padding: 12px 0;
            background: #8a2be2;
            border: none;
            border-radius: 8px;
            font-size: 1.15rem;
            font-weight: 700;
            color: white;
            cursor: pointer;
            transition: background 0.3s ease;
            box-shadow: 0 5px 15px rgba(138, 43, 226, 0.6);
        }

        .currency-container button:hover {
            background: #6f23c8;
        }

        #currencyResult {
            margin-top: 25px;
            padding: 20px;
            background: #f0f0f0;
            /* Changed background for visibility */
            border-radius: 12px;
            text-align: center;
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: 1px;
            min-height: 60px;
            line-height: 1.5;
            color: #333;
        }

        /* Styles from weather2.html */
        .weather-container {
            background: white;
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            max-width: 900px;
            width: 100%;
        }

        .weather-container h1 {
            text-align: center;
            margin-bottom: 1.5rem;
            font-size: 2rem;
            color: #333;
        }

        .search-box {
            display: flex;
            justify-content: center;
            margin-bottom: 1.5rem;
        }

        .search-box input {
            width: 70%;
            padding: 0.8rem;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 8px 0 0 8px;
        }

        .search-box button {
            padding: 0.8rem 1.2rem;
            font-size: 1rem;
            border: none;
            background-color: #4a90e2;
            color: white;
            border-radius: 0 8px 8px 0;
            cursor: pointer;
            transition: background 0.3s;
        }

        .search-box button:hover {
            background-color: #357ABD;
        }

        .weather-result {
            background: #f9f9f9;
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid #eee;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .label {
            font-weight: bold;
            color: #444;
        }

        #weatherChart {
            max-width: 100%;
            height: 400px;
        }

        @media (max-width: 600px) {
            .main-container {
                margin: 20px;
                padding: 15px;
            }

            .tab-button {
                font-size: 0.9rem;
                padding: 10px 10px;
            }

            .currency-container {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>
    <div class="main-container">
        <div class="tabs">
            <button class="tab-button active" onclick="openTab(event, 'cityInfo')">城市資訊</button>
            <button class="tab-button" onclick="openTab(event, 'airQuality')">空氣品質</button>
            <button class="tab-button" onclick="openTab(event, 'currencyConverter')">外匯換算</button>
            <button class="tab-button" onclick="openTab(event, 'globalWeather')">全球天氣</button>
        </div>

        <div id="cityInfo" class="tab-content active city-info-container">
            <h1>城市資訊查詢</h1>
            <input type="text" id="geoCityInput" placeholder="請輸入城市名稱 (限英文)，如：Taipei">
            <button onclick="searchCity()">查詢</button>
            <div id="geoMessage" class="city-info-loading"></div>
            <div id="geoResult" class="city-info-result"></div>
        </div>

        <div id="airQuality" class="tab-content aqi-container">
            <h1>空氣品質查詢</h1>
            <input type="text" id="aqiCityInput" placeholder="請輸入城市名稱 (限英文)，例如 Taipei" />
            <button onclick="getAirQuality()">查詢空氣品質</button>
            <div id="aqiResult" class="aqi-result"></div>
        </div>

        <div id="currencyConverter" class="tab-content currency-container">
            <h1>外匯匯率轉換器</h1>

            <label for="amount">輸入金額</label>
            <input type="number" id="amount" placeholder="請輸入數字" min="0" step="any" value="1" />

            <label for="fromCurrency">從（貨幣）</label>
            <select id="fromCurrency"></select>

            <label for="toCurrency">換成（貨幣）</label>
            <select id="toCurrency"></select>

            <button id="btnConvert">立即換算</button>

            <div id="currencyResult">請輸入金額並選擇貨幣後，點擊換算</div>
        </div>

        <div id="globalWeather" class="tab-content weather-container">
            <h1>🌍 全球天氣查詢</h1>
            <div class="search-box">
                <input type="text" id="weatherCityInput" placeholder="請輸入國家或城市名稱 (限英文)..." />
                <button onclick="getWeather()">查詢</button>
            </div>
            <div class="weather-result" id="weatherResultBox">請輸入國家或城市並點擊「查詢」來取得天氣資訊。</div>
            <canvas id="weatherChart"></canvas>
        </div>
    </div>

    <script>
        // Tab switching logic
        function openTab(evt, tabName) {
            let i, tabContent, tabButtons;
            tabContent = document.getElementsByClassName("tab-content");
            for (i = 0; i < tabContent.length; i++) {
                tabContent[i].style.display = "none";
            }
            tabButtons = document.getElementsByClassName("tab-button");
            for (i = 0; i < tabButtons.length; i++) {
                tabButtons[i].className = tabButtons[i].className.replace(" active", "");
            }
            document.getElementById(tabName).style.display = "block";
            evt.currentTarget.className += " active";

            // Specific logic for chart to render correctly when its tab is opened
            if (tabName === 'globalWeather' && chartInstance) {
                setTimeout(() => chartInstance.resize(), 0); // Re-render chart if active
            }
        }

        // --- GeoDB (City Info) Script ---
        const GEO_API_KEY = "e7ae0cea05msh45d7e3af1310a1bp12a4b7jsn6de8688ed98d";
        const GEO_API_HOST = "wft-geo-db.p.rapidapi.com";

        async function searchCity() {
            const cityName = document.getElementById("geoCityInput").value.trim();
            const message = document.getElementById("geoMessage");
            const resultDiv = document.getElementById("geoResult");

            if (!cityName) {
                message.innerHTML = "<div class='city-info-error'>請輸入城市名稱</div>";
                resultDiv.innerHTML = "";
                return;
            }

            // 檢查是否只包含英文字母、空格和連字符
            if (!/^[a-zA-Z\s-]+$/.test(cityName)) {
                message.innerHTML = "<div class='city-info-error'>城市名稱只能輸入英文字母、空格或連字符。</div>";
                resultDiv.innerHTML = "";
                return;
            }


            message.textContent = "查詢中...";
            resultDiv.innerHTML = "";

            try {
                const res = await fetch(`https://${GEO_API_HOST}/v1/geo/cities?namePrefix=${cityName}&limit=1`, {
                    method: "GET",
                    headers: {
                        "X-RapidAPI-Key": GEO_API_KEY,
                        "X-RapidAPI-Host": GEO_API_HOST
                    }
                });

                if (!res.ok) throw new Error("無法取得資料");

                const data = await res.json();

                if (data.data.length === 0) {
                    message.innerHTML = "<div class='city-info-error'>查無此城市</div>";
                    return;
                }

                const city = data.data[0];
                message.innerHTML = "";

                resultDiv.innerHTML = `
          <div class="info-card">
            <strong>城市名稱：</strong>${city.city}<br>
            <strong>國家：</strong>${city.country}<br>
            <strong>地區/州：</strong>${city.region}<br>
            <strong>人口：</strong>${city.population.toLocaleString()} 人<br>
            <strong>時區：</strong>${city.timezone}<br>
            <strong>座標：</strong>${city.latitude}, ${city.longitude}
          </div>
        `;
            } catch (err) {
                message.innerHTML = `<div class='city-info-error'>查詢錯誤：${err.message}</div>`;
            }
        }

        // --- OpenWeather (Air Quality) Script ---
        const AQI_API_KEY = "6c125517593a85f53a5d393c9e14c09e";

        async function getAirQuality() {
            const city = document.getElementById('aqiCityInput').value.trim();
            const resultDiv = document.getElementById('aqiResult');

            if (!city) {
                resultDiv.innerHTML = "<span style='color:red;'>請輸入城市名稱</span>";
                return;
            }

            // 檢查是否只包含英文字母、空格和連字符
            if (!/^[a-zA-Z\s-]+$/.test(city)) {
                resultDiv.innerHTML = "<span style='color:red;'>城市名稱只能輸入英文字母、空格或連字符。</span>";
                return;
            }

            resultDiv.innerHTML = "查詢中...";

            try {
                // 查城市的經緯度
                const geoUrl = `https://api.openweathermap.org/geo/1.0/direct?q=${encodeURIComponent(city)}&limit=1&appid=${AQI_API_KEY}`;
                const geoRes = await fetch(geoUrl);
                const geoData = await geoRes.json();

                if (!geoData || geoData.length === 0) {
                    resultDiv.innerHTML = "找不到該城市，請確認拼字";
                    return;
                }

                const {
                    lat,
                    lon
                } = geoData[0];

                // 查空氣品質
                const airUrl = `https://api.openweathermap.org/data/2.5/air_pollution?lat=${lat}&lon=${lon}&appid=${AQI_API_KEY}`;
                const airRes = await fetch(airUrl);
                const airData = await airRes.json();

                const aqi = airData.list[0].main.aqi;
                const components = airData.list[0].components;

                const aqiLevels = [
                    {
                        text: "良好 Good 😊",
                        color: "#009966"
                    },
                    {
                        text: "普通 Fair 😐",
                        color: "#ffde33"
                    },
                    {
                        text: "對敏感族群不健康 Moderate 😷",
                        color: "#ff9933"
                    },
                    {
                        text: "不健康 Poor 🤒",
                        color: "#cc0033"
                    },
                    {
                        text: "非常不健康 Very Poor ☠️",
                        color: "#660099"
                    }
                ];

                const level = aqiLevels[aqi - 1];

                // 顯示內容
                let html = `
          <h3>📍 城市：${city}</h3>
          <div style="
            background-color: ${level.color};
            color: white;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 16px;
          ">
            🌫 AQI 指數：${aqi} - ${level.text}
          </div>
          <div><strong>🧪 污染物濃度（μg/m³）：</strong>
            <ul>
        `;

                for (const key in components) {
                    html += `<li>${key.toUpperCase()}: ${components[key]}</li>`;
                }
                html += `</ul></div>`;

                resultDiv.innerHTML = html;
            } catch (error) {
                console.error(error);
                resultDiv.innerHTML = "<span style='color:red;'>查詢失敗，請稍後再試。</span>";
            }
        }

        // --- ExchangeRate-API (Currency Converter) Script ---
        const CURRENCY_API_KEY = "de60900717fc0b7c3153b864";
        const CURRENCY_API_BASE = `https://v6.exchangerate-api.com/v6/${CURRENCY_API_KEY}/latest/`;

        const currencySymbols = {
            "USD": "$",
            "TWD": "NT$",
            "JPY": "¥",
            "EUR": "€",
            "GBP": "£",
            "AUD": "A$",
            "CAD": "C$",
            "CHF": "Fr.",
            "CNY": "¥",
            "HKD": "HK$"
        };

        const currencies = Object.keys(currencySymbols);

        const fromSelect = document.getElementById("fromCurrency");
        const toSelect = document.getElementById("toCurrency");
        const amountInput = document.getElementById("amount");
        const btnConvert = document.getElementById("btnConvert");
        const currencyResultDiv = document.getElementById("currencyResult"); // Renamed to avoid conflict

        function populateSelects() {
            currencies.forEach(cur => {
                fromSelect.innerHTML += `<option value="${cur}">${cur}</option>`;
                toSelect.innerHTML += `<option value="${cur}">${cur}</option>`;
            });
            fromSelect.value = "USD";
            toSelect.value = "TWD";
        }

        async function getRates(base) {
            try {
                currencyResultDiv.textContent = "查詢中...";
                const res = await fetch(CURRENCY_API_BASE + base);
                const data = await res.json();
                if (data.result === "success") {
                    return data.conversion_rates;
                } else {
                    throw new Error(data["error-type"] || "API 錯誤");
                }
            } catch (error) {
                currencyResultDiv.textContent = `錯誤: ${error.message}`;
                return null;
            }
        }

        async function convert() {
            const amount = parseFloat(amountInput.value);
            const from = fromSelect.value;
            const to = toSelect.value;

            if (isNaN(amount) || amount <= 0) {
                currencyResultDiv.textContent = "請輸入正確的金額";
                return;
            }
            if (from === to) {
                currencyResultDiv.textContent = "請選擇不同的貨幣";
                return;
            }

            const rates = await getRates(from);
            if (!rates) return;

            const rate = rates[to];
            if (!rate) {
                currencyResultDiv.textContent = `查無 ${to} 匯率資料`;
                return;
            }

            const symbolFrom = currencySymbols[from] || from;
            const symbolTo = currencySymbols[to] || to;
            const converted = (amount * rate).toFixed(4);

            currencyResultDiv.innerHTML =
                `<div>1 ${from} = ${rate} ${to}</div>` +
                `<div>${symbolFrom} ${amount} = ${symbolTo} ${converted}</div>`;
        }

        btnConvert.addEventListener("click", convert);


        // --- OpenWeatherMap (Global Weather) Script ---
        let chartInstance; // Global variable for Chart.js instance

        async function getWeather() {
            const apiKey = '6c125517593a85f53a5d393c9e14c09e';
            const city = document.getElementById('weatherCityInput').value.trim();
            const resultBox = document.getElementById('weatherResultBox');

            if (!city) {
                resultBox.textContent = '⚠️ 請輸入有效的國家或城市名稱';
                return;
            }

            // 檢查是否只包含英文字母、空格和連字符
            if (!/^[a-zA-Z\s-]+$/.test(city)) {
                resultBox.textContent = '⚠️ 國家或城市名稱只能輸入英文字母、空格或連字符。';
                return;
            }

            resultBox.textContent = '🔄 正在取得天氣資料...';

            try {
                const response = await fetch(`https://api.openweathermap.org/data/2.5/forecast?q=${encodeURIComponent(city)}&appid=${apiKey}&units=metric&lang=zh_tw`);
                if (!response.ok) throw new Error(`查詢失敗：HTTP ${response.status}`);

                const data = await response.json();
                const current = data.list[0];
                const weather = current.weather[0];
                const main = current.main;
                const wind = current.wind;
                const rain = current.rain || {};
                const visibility = current.visibility;
                const clouds = current.clouds;

                resultBox.innerHTML = `
          <div><span class="label">📍 城市：</span>${data.city.name}</div>
          <div><span class="label">🌤️ 天氣狀況：</span>${weather.description}（${weather.main}）</div>
          <div><span class="label">🌡️ 溫度：</span>${main.temp}°C（體感：${main.feels_like}°C）</div>
          <div><span class="label">🌡️ 最低 / 最高溫：</span>${main.temp_min}°C / ${main.temp_max}°C</div>
          <div><span class="label">💧 濕度：</span>${main.humidity}%</div>
          <div><span class="label">🌬️ 風速：</span>${wind.speed} m/s，方向：${wind.deg}°</div>
          <div><span class="label">🌧️ 降雨量：</span>${rain['3h'] ? rain['3h'] + ' mm / 3hr' : '無'}</div>
          <div><span class="label">🌫️ 能見度：</span>${visibility} 公尺</div>
          <div><span class="label">☁️ 雲量：</span>${clouds.all}%</div>
          <div><span class="label">🧭 氣壓：</span>${main.pressure} hPa</div>
        `;

                // 圖表繪製
                const labels = data.list.slice(0, 8).map(entry => {
                    const d = new Date(entry.dt * 1000);
                    return d.getHours() + ':00';
                });
                const temps = data.list.slice(0, 8).map(entry => entry.main.temp);

                const ctx = document.getElementById('weatherChart').getContext('2d');
                if (chartInstance) chartInstance.destroy();
                chartInstance = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: '未來24小時溫度 (°C)',
                            data: temps,
                            fill: false,
                            borderColor: '#4a90e2',
                            tension: 0.3
                        }]
                    },
                    options: {
                        scales: {
                            y: {
                                beginAtZero: false
                            }
                        }
                    }
                });

            } catch (error) {
                resultBox.textContent = `❌ 錯誤：${error.message}`;
            }
        }

        // Initialize currency converter selects and default tab on load
        document.addEventListener('DOMContentLoaded', () => {
            populateSelects();
            // Open the first tab by default
            document.querySelector('.tab-button').click();
        });
    </script>
</body>

</html>
