<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>城市資訊整合平台</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Noto+Sans+TC&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Noto Sans TC', 'Roboto', sans-serif;
            background: linear-gradient(to right, #e0f7fa, #ffffff);
            margin: 0;
            padding: 0;
        }

        .tabs {
            display: flex;
            background-color: #00796b;
        }

        .tab {
            flex: 1;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            color: white;
            font-weight: bold;
            background-color: #00796b;
            border-bottom: 3px solid transparent;
        }

        .tab.active {
            border-bottom: 3px solid #fff;
            background-color: #004d40;
        }

        .tab-content {
            display: none;
            padding: 20px;
        }

        .tab-content.active {
            display: block;
        }

        .container,
        .weather-container {
            max-width: 800px;
            margin: 30px auto;
            background: #fff;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
        }

        button {
            background-color: #00796b;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 10px 16px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #004d40;
        }

        input[type="text"] {
            width: 70%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 16px;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>
    <div class="tabs">
        <div class="tab active" onclick="openTab('weather')">🌍 天氣查詢</div>
        <div class="tab" onclick="openTab('air')">🌫 空氣品質</div>
        <div class="tab" onclick="openTab('geo')">🗺 城市資訊</div>
    </div>

    <div id="weather" class="tab-content active">
        <div class="weather-container">
            <h2>🌍 全球天氣查詢</h2>
            <div class="search-box">
                <input type="text" id="weatherCity" placeholder="請輸入城市名稱..." />
                <button onclick="getWeather()">查詢</button>
            </div>
            <div id="weatherResult">請輸入城市並點擊「查詢」來取得天氣資訊。</div>
            <canvas id="weatherChart"></canvas>
        </div>
    </div>

    <div id="air" class="tab-content">
        <div class="container">
            <h2>🌫 空氣品質查詢</h2>
            <input type="text" id="airCity" placeholder="請輸入城市名稱，例如 Taipei" />
            <button onclick="getAirQuality()">查詢空氣品質</button>
            <div id="airResult"></div>
        </div>
    </div>

    <div id="geo" class="tab-content">
        <div class="container">
            <h2>🗺 城市資訊查詢</h2>
            <input type="text" id="geoCity" placeholder="請輸入城市名稱，例如 Taipei" />
            <button onclick="searchCity()">查詢</button>
            <div id="geoMsg"></div>
            <div id="geoResult"></div>
        </div>
    </div>

    <script>
        function openTab(tabName) {
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            document.querySelector(`.tab[onclick*="${tabName}"]`).classList.add('active');
            document.getElementById(tabName).classList.add('active');
        }

        let chartInstance;

        async function getWeather() {
            const apiKey = '6c125517593a85f53a5d393c9e14c09e';
            const city = document.getElementById('weatherCity').value.trim();
            const resultBox = document.getElementById('weatherResult');

            if (!city) return resultBox.textContent = '⚠️ 請輸入有效的城市名稱';

            resultBox.textContent = '🔄 正在取得天氣資料...';

            try {
                const response = await fetch(`https://api.openweathermap.org/data/2.5/forecast?q=${encodeURIComponent(city)}&appid=${apiKey}&units=metric&lang=zh_tw`);
                const data = await response.json();
                const current = data.list[0];
                const weather = current.weather[0];
                const main = current.main;
                const wind = current.wind;
                const rain = current.rain || {};
                const visibility = current.visibility;
                const clouds = current.clouds;

                resultBox.innerHTML = `
          <div><b>📍 城市：</b>${data.city.name}</div>
          <div><b>🌤️ 天氣：</b>${weather.description}</div>
          <div><b>🌡️ 溫度：</b>${main.temp}°C，體感：${main.feels_like}°C</div>
          <div><b>💧 濕度：</b>${main.humidity}%</div>
          <div><b>🌬️ 風速：</b>${wind.speed} m/s</div>
        `;

                const labels = data.list.slice(0, 8).map(e => new Date(e.dt * 1000).getHours() + ':00');
                const temps = data.list.slice(0, 8).map(e => e.main.temp);
                const ctx = document.getElementById('weatherChart').getContext('2d');
                if (chartInstance) chartInstance.destroy();
                chartInstance = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels,
                        datasets: [{ label: '未來溫度 (°C)', data: temps, borderColor: '#4a90e2', tension: 0.3 }]
                    },
                    options: { scales: { y: { beginAtZero: false } } }
                });
            } catch (error) {
                resultBox.textContent = `❌ 錯誤：${error.message}`;
            }
        }

        async function getAirQuality() {
            const apiKey = "6c125517593a85f53a5d393c9e14c09e";
            const city = document.getElementById('airCity').value.trim();
            const resultDiv = document.getElementById('airResult');

            if (!city) return resultDiv.innerHTML = "<span style='color:red;'>請輸入城市名稱</span>";
            resultDiv.textContent = '查詢中...';

            try {
                const geoRes = await fetch(`https://api.openweathermap.org/geo/1.0/direct?q=${encodeURIComponent(city)}&limit=1&appid=${apiKey}`);
                const geoData = await geoRes.json();
                if (!geoData.length) return resultDiv.innerHTML = "找不到該城市";

                const { lat, lon } = geoData[0];
                const airRes = await fetch(`https://api.openweathermap.org/data/2.5/air_pollution?lat=${lat}&lon=${lon}&appid=${apiKey}`);
                const airData = await airRes.json();

                const aqi = airData.list[0].main.aqi;
                const components = airData.list[0].components;
                const aqiLevels = [
                    { text: "良好 😊", color: "#009966" },
                    { text: "普通 😐", color: "#ffde33" },
                    { text: "敏感族群不健康 😷", color: "#ff9933" },
                    { text: "不健康 🤒", color: "#cc0033" },
                    { text: "非常不健康 ☠️", color: "#660099" }
                ];
                const level = aqiLevels[aqi - 1];

                let html = `<div style="background:${level.color};color:white;padding:10px;border-radius:8px;text-align:center">
          🌫 AQI 指數：${aqi} - ${level.text}
        </div><ul>`;
                for (const key in components) {
                    html += `<li>${key.toUpperCase()}: ${components[key]}</li>`;
                }
                html += "</ul>";
                resultDiv.innerHTML = html;
            } catch (e) {
                resultDiv.innerHTML = "<span style='color:red;'>查詢失敗，請稍後再試。</span>";
            }
        }

        async function searchCity() {
            const API_KEY = "e7ae0cea05msh45d7e3af1310a1bp12a4b7jsn6de8688ed98d";
            const API_HOST = "wft-geo-db.p.rapidapi.com";
            const city = document.getElementById("geoCity").value.trim();
            const msg = document.getElementById("geoMsg");
            const result = document.getElementById("geoResult");

            if (!city) return msg.innerHTML = "<div class='error'>請輸入城市名稱</div>";
            msg.textContent = "查詢中...";
            result.innerHTML = "";

            try {
                const res = await fetch(`https://${API_HOST}/v1/geo/cities?namePrefix=${city}&limit=1`, {
                    headers: {
                        "X-RapidAPI-Key": API_KEY,
                        "X-RapidAPI-Host": API_HOST
                    }
                });
                const data = await res.json();
                if (!data.data.length) return msg.innerHTML = "<div class='error'>查無此城市</div>";
                const c = data.data[0];
                msg.innerHTML = "";
                result.innerHTML = `
          <div class="info-card">
            <b>城市：</b>${c.city}<br>
            <b>國家：</b>${c.country}<br>
            <b>地區：</b>${c.region}<br>
            <b>人口：</b>${c.population.toLocaleString()} 人<br>
            <b>時區：</b>${c.timezone}<br>
            <b>座標：</b>${c.latitude}, ${c.longitude}
          </div>`;
            } catch (err) {
                msg.innerHTML = `<div class='error'>錯誤：${err.message}</div>`;
            }
        }
    </script>
</body>

</html>
